      - RunMigrations=true
      - ConnectionStrings__PaymentDb=Host=postgres;Database=PaymentDb;Username=paymentswitch;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - Jwt__Secret=${JWT_SECRET:?Set JWT_SECRET in .env}
      - ServiceToken__Secret=${SERVICE_TOKEN_SECRET:?Set SERVICE_TOKEN_SECRET in .env}
      - Jwt__PreviousSecret=${JWT_PREVIOUS_SECRET:-}
      - Jwt__Issuer=IdentityService
      - Jwt__Audience=PaymentSwitch
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS:-}
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      - RabbitMQ__Password=${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - paymentswitch-network

  ledger-api:
    build:
      context: .
      dockerfile: src/Services/Ledger/Ledger.API/Dockerfile
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
    ports:
      - "127.0.0.1:5320:8080"
    # Step 9.3: readiness (Kestrel + migrations + DB + broker) gates the
    # webs and nginx below, so cold starts order themselves.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - RunMigrations=true
      - ConnectionStrings__LedgerDb=Host=postgres;Database=LedgerDb;Username=paymentswitch;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - Jwt__Secret=${JWT_SECRET:?Set JWT_SECRET in .env}
      - ServiceToken__Secret=${SERVICE_TOKEN_SECRET:?Set SERVICE_TOKEN_SECRET in .env}
      - Jwt__PreviousSecret=${JWT_PREVIOUS_SECRET:-}
      - Jwt__Issuer=IdentityService
      - Jwt__Audience=PaymentSwitch
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS:-}
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      - RabbitMQ__Password=${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - paymentswitch-network

  notification-api:
    build:
      context: .
      dockerfile: src/Services/Notification/Notification.API/Dockerfile
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
    ports:
      - "127.0.0.1:5281:8080"
    # Step 9.3: readiness (Kestrel + migrations + DB + broker) gates the
    # webs and nginx below, so cold starts order themselves.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - RunMigrations=true
      - ConnectionStrings__NotificationDb=Host=postgres;Database=NotificationDb;Username=paymentswitch;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - Jwt__Secret=${JWT_SECRET:?Set JWT_SECRET in .env}
      - ServiceToken__Secret=${SERVICE_TOKEN_SECRET:?Set SERVICE_TOKEN_SECRET in .env}
      - Jwt__PreviousSecret=${JWT_PREVIOUS_SECRET:-}
      - Jwt__Issuer=IdentityService
      - Jwt__Audience=PaymentSwitch
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS:-}
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      - RabbitMQ__Password=${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
      - Smtp__Host=${SMTP_HOST:-}
      - Smtp__Port=${SMTP_PORT:-587}
      - Smtp__Username=${SMTP_USERNAME:-}
      - Smtp__Password=${SMTP_PASSWORD:-}
      - Smtp__FromAddress=${SMTP_FROM_ADDRESS:-noreply@paymentswitch.com}
      - Smtp__FromName=${SMTP_FROM_NAME:-PaymentSwitch}
      - Sms__Enabled=${SMS_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - paymentswitch-network

  settlement-api:
    build:
      context: .
      dockerfile: src/Services/Settlement/Settlement.API/Dockerfile
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
    ports:
      - "127.0.0.1:5392:8080"
    # Step 9.3: readiness (Kestrel + migrations + DB + broker) gates the
    # webs and nginx below, so cold starts order themselves.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - RunMigrations=true
      - ConnectionStrings__SettlementDb=Host=postgres;Database=SettlementDb;Username=paymentswitch;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - Jwt__Secret=${JWT_SECRET:?Set JWT_SECRET in .env}
      - ServiceToken__Secret=${SERVICE_TOKEN_SECRET:?Set SERVICE_TOKEN_SECRET in .env}
      - Jwt__PreviousSecret=${JWT_PREVIOUS_SECRET:-}
      - Jwt__Issuer=IdentityService
      - Jwt__Audience=PaymentSwitch
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS:-}
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      - RabbitMQ__Password=${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - paymentswitch-network

  merchant-web:
    build:
      context: .
      dockerfile: apps/merchant/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${FRONTEND_BASE_URL:-http://localhost}
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 128M
    environment:
      - NEXT_PUBLIC_API_URL=${FRONTEND_BASE_URL:-http://localhost}
    # Step 9.3: prove the standalone server is up (see
    # apps/merchant/src/app/api/health/route.ts).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    depends_on:
      identity-api:
        condition: service_healthy
      merchant-api:
        condition: service_healthy
      payment-api:
        condition: service_healthy
      ledger-api:
        condition: service_healthy
      notification-api:
        condition: service_healthy
      settlement-api:
        condition: service_healthy
    networks:
      - paymentswitch-network

  admin-web:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${FRONTEND_BASE_URL:-http://localhost}
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 128M
    environment:
      - NEXT_PUBLIC_API_URL=${FRONTEND_BASE_URL:-http://localhost}
    # Step 9.3: prove the standalone server is up (see
    # apps/admin/src/app/api/health/route.ts).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    depends_on:
      identity-api:
        condition: service_healthy
      merchant-api:
        condition: service_healthy
      payment-api:
        condition: service_healthy
      ledger-api:
        condition: service_healthy
      notification-api:
        condition: service_healthy
      settlement-api:
        condition: service_healthy
    networks:
      - paymentswitch-network

  nginx:
    image: nginx:alpine
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Dev serves plain HTTP on :80 only (ports below). Production TLS
      # (:443 + tls server blocks) comes from docker-compose.prod.yml
      # (Step 9.6) — see docs/tls.md. Do not add 443 here: an operator who
      # never opts into the overlay must not bind a port nothing serves.
      - ./infra/nginx/http:/etc/nginx/tls:ro
    ports:
      - "80:80"
    # Step 9.3: prove the ingress serves through to a healthy upstream
    # (catches bad mounts/routes, not just a running nginx master).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/identity/health/live | grep -q Healthy"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    depends_on:
      identity-api:
        condition: service_healthy
      merchant-api:
        condition: service_healthy
      payment-api:
        condition: service_healthy
      ledger-api:
        condition: service_healthy
      notification-api:
        condition: service_healthy
      settlement-api:
        condition: service_healthy
      merchant-web:
        condition: service_healthy
      admin-web:
        condition: service_healthy
    networks:
      - paymentswitch-network

  # Step 10.1: nightly backup job. Runs pg-backup.sh on a daily loop against
  # the postgres service and keeps 14 dailies in the pgbackups volume (plus
  # SHA256SUMS). Uses the postgres image so pg_dump matches the server major
  # version. Off-host copies are a separate host-cron step (see runbook §3).
  backup:
    image: postgres:16-alpine
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 128M
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=paymentswitch
      - PGPASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - BACKUP_DIR=/backups
      - KEEP_DAILY=14
    command: ["sh", "-c", "while true; do /backup/pg-backup.sh; sleep 86400; done"]
    volumes:
      - ./infra/backup:/backup:ro
      - pgbackups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - paymentswitch-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  # Step 10.1: nightly backup artifacts (see the backup service below and
  # infra/backup/). Sync off-host (S3) from the host cron — a volume alone
  # is not a backup.
  pgbackups:

networks:
  paymentswitch-network:
    driver: bridge