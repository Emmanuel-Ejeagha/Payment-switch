services:
  # Only nginx (:80/:443) is the public ingress. Every other published port is
# bound to loopback (127.0.0.1) so it is reachable only from the host, not the
# internet — Swagger/metrics/Hangfire and infra UIs stay out of reach
# (TASK-046, docs/prod-exposure.md). Open only 80/443 in the EC2 security group.
  postgres:
    image: postgres:16-alpine
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: paymentswitch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-multiple-databases.sql:/docker-entrypoint-initdb.d/init-multiple-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paymentswitch"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - paymentswitch-network

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    networks:
      - paymentswitch-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: always
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
      - "127.0.0.1:15692:15692"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
      RABBITMQ_ENABLED_PLUGINS: rabbitmq_management,rabbitmq_prometheus
      # Writable location for the env-driven plugins file: the image's default
      # /etc/rabbitmq/enabled_plugins is not writable by the rabbitmq user at
      # boot (fresh-container repro: permission denied -> crash-loop). The data
      # volume is owned by rabbitmq and survives restarts.
      RABBITMQ_ENABLED_PLUGINS_FILE: /var/lib/rabbitmq/enabled_plugins
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - paymentswitch-network

  jaeger:
    image: jaegertracing/all-in-one:1.58
    restart: always
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:16686/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    networks:
      - paymentswitch-network

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: always
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1G
    networks:
      - paymentswitch-network

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: always
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9093/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    networks:
      - paymentswitch-network

  grafana:
    image: grafana/grafana:10.4.3
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./infra/grafana/provisioning/dashboards:/var/lib/grafana/dashboards
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    networks:
      - paymentswitch-network

  identity-api:
    build:
      context: .
      dockerfile: src/Services/Identity/Identity.API/Dockerfile
    restart: always
    ports:
      - "127.0.0.1:5146:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - RunMigrations=true
      - ConnectionStrings__IdentityDb=Host=postgres;Database=IdentityDb;Username=paymentswitch;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - Jwt__Secret=${JWT_SECRET:?Set JWT_SECRET in .env}
      - Jwt__PreviousSecret=${JWT_PREVIOUS_SECRET:-}
      - Jwt__Issuer=IdentityService
      - Jwt__Audience=PaymentSwitch
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS:-}
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      - RabbitMQ__Password=${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
      - Seed__AdminEmail=${SEED_ADMIN_EMAIL:-admin@paymentswitch.com}
      - Seed__AdminPassword=${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in .env}
      - EmailVerification__FrontendBaseUrl=${FRONTEND_BASE_URL:-http://localhost:3000}
      - EmailVerification__ResendCooldownSeconds=${EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS:-60}
      - PasswordReset__FrontendBaseUrl=${FRONTEND_BASE_URL:-http://localhost:3000}
      - PasswordReset__TokenLifetimeHours=${PASSWORD_RESET_TOKEN_LIFETIME_HOURS:-1}
      - Smtp__Host=${SMTP_HOST:-}
      - Smtp__Port=${SMTP_PORT:-587}
      - Smtp__Username=${SMTP_USERNAME:-}
      - Smtp__Password=${SMTP_PASSWORD:-}
      - Smtp__FromAddress=${SMTP_FROM_ADDRESS:-noreply@paymentswitch.com}
      - Smtp__FromName=${SMTP_FROM_NAME:-PaymentSwitch}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - paymentswitch-network

  merchant-api:
    build:
      context: .
      dockerfile: src/Services/Merchant/Merchant.API/Dockerfile
    restart: always
    ports:
      - "127.0.0.1:5237:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - RunMigrations=true
      - ConnectionStrings__MerchantDb=Host=postgres;Database=MerchantDb;Username=paymentswitch;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - Jwt__Secret=${JWT_SECRET:?Set JWT_SECRET in .env}
      - ServiceToken__Secret=${SERVICE_TOKEN_SECRET:?Set SERVICE_TOKEN_SECRET in .env}
      - Jwt__PreviousSecret=${JWT_PREVIOUS_SECRET:-}
      - Jwt__Issuer=IdentityService
      - Jwt__Audience=PaymentSwitch
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS:-}
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      - RabbitMQ__Password=${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
      - WebhookSecretEncryption__Key=${WEBHOOK_SECRET_ENCRYPTION_KEY:?Set WEBHOOK_SECRET_ENCRYPTION_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - paymentswitch-network

  payment-api:
    build:
      context: .
      dockerfile: src/Services/Payment/Payment.API/Dockerfile
    restart: always
    ports:
      - "127.0.0.1:5118:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - RunMigrations=true
      - ConnectionStrings__PaymentDb=Host=postgres;Database=PaymentDb;Username=paymentswitch;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - Jwt__Secret=${JWT_SECRET:?Set JWT_SECRET in .env}
      - ServiceToken__Secret=${SERVICE_TOKEN_SECRET:?Set SERVICE_TOKEN_SECRET in .env}
      - Jwt__PreviousSecret=${JWT_PREVIOUS_SECRET:-}
      - Jwt__Issuer=IdentityService
      - Jwt__Audience=PaymentSwitch
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS:-}
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      - RabbitMQ__Password=${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - paymentswitch-network

  ledger-api:
    build:
      context: .
      dockerfile: src/Services/Ledger/Ledger.API/Dockerfile
    restart: always
    ports:
      - "127.0.0.1:5320:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - RunMigrations=true
      - ConnectionStrings__LedgerDb=Host=postgres;Database=LedgerDb;Username=paymentswitch;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - Jwt__Secret=${JWT_SECRET:?Set JWT_SECRET in .env}
      - ServiceToken__Secret=${SERVICE_TOKEN_SECRET:?Set SERVICE_TOKEN_SECRET in .env}
      - Jwt__PreviousSecret=${JWT_PREVIOUS_SECRET:-}
      - Jwt__Issuer=IdentityService
      - Jwt__Audience=PaymentSwitch
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS:-}
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      - RabbitMQ__Password=${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - paymentswitch-network

  notification-api:
    build:
      context: .
      dockerfile: src/Services/Notification/Notification.API/Dockerfile
    restart: always
    ports:
      - "127.0.0.1:5281:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - RunMigrations=true
      - ConnectionStrings__NotificationDb=Host=postgres;Database=NotificationDb;Username=paymentswitch;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - Jwt__Secret=${JWT_SECRET:?Set JWT_SECRET in .env}
      - ServiceToken__Secret=${SERVICE_TOKEN_SECRET:?Set SERVICE_TOKEN_SECRET in .env}
      - Jwt__PreviousSecret=${JWT_PREVIOUS_SECRET:-}
      - Jwt__Issuer=IdentityService
      - Jwt__Audience=PaymentSwitch
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS:-}
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      - RabbitMQ__Password=${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
      - Smtp__Host=${SMTP_HOST:-}
      - Smtp__Port=${SMTP_PORT:-587}
      - Smtp__Username=${SMTP_USERNAME:-}
      - Smtp__Password=${SMTP_PASSWORD:-}
      - Smtp__FromAddress=${SMTP_FROM_ADDRESS:-noreply@paymentswitch.com}
      - Smtp__FromName=${SMTP_FROM_NAME:-PaymentSwitch}
      - Sms__Enabled=${SMS_ENABLED:-false}
      - Resend__ApiKey=${RESEND_API_KEY:-}
      - Resend__FromEmail=${RESEND_FROM_EMAIL:-noreply@paymentswitch.com}
      - Resend__FromName=${RESEND_FROM_NAME:-PaymentSwitch}
      - Resend__TimeoutSeconds=${RESEND_TIMEOUT_SECONDS:-30}
      - EmailVerification__FrontendBaseUrl=${FRONTEND_BASE_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - paymentswitch-network

  settlement-api:
    build:
      context: .
      dockerfile: src/Services/Settlement/Settlement.API/Dockerfile
    restart: always
    ports:
      - "127.0.0.1:5392:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - RunMigrations=true
      - ConnectionStrings__SettlementDb=Host=postgres;Database=SettlementDb;Username=paymentswitch;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - Jwt__Secret=${JWT_SECRET:?Set JWT_SECRET in .env}
      - ServiceToken__Secret=${SERVICE_TOKEN_SECRET:?Set SERVICE_TOKEN_SECRET in .env}
      - Jwt__PreviousSecret=${JWT_PREVIOUS_SECRET:-}
      - Jwt__Issuer=IdentityService
      - Jwt__Audience=PaymentSwitch
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS:-}
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      - RabbitMQ__Password=${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - paymentswitch-network

  merchant-web:
    build:
      context: .
      dockerfile: apps/merchant/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${FRONTEND_BASE_URL:-http://localhost}
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=${FRONTEND_BASE_URL:-http://localhost}
      # Server-side service origin for Next.js Route Handlers (localhost inside
      # a container is the app itself, not nginx).
      - INTERNAL_API_URL=http://nginx
    depends_on:
      identity-api:
        condition: service_healthy
      merchant-api:
        condition: service_healthy
      payment-api:
        condition: service_healthy
      ledger-api:
        condition: service_healthy
      notification-api:
        condition: service_healthy
      settlement-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    networks:
      - paymentswitch-network

  admin-web:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${FRONTEND_BASE_URL:-http://localhost}
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=${FRONTEND_BASE_URL:-http://localhost}
      # Server-side service origin for Next.js Route Handlers (localhost inside
      # a container is the app itself, not nginx).
      - INTERNAL_API_URL=http://nginx
    depends_on:
      identity-api:
        condition: service_healthy
      merchant-api:
        condition: service_healthy
      payment-api:
        condition: service_healthy
      ledger-api:
        condition: service_healthy
      notification-api:
        condition: service_healthy
      settlement-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    networks:
      - paymentswitch-network

  nginx:
    image: nginx:alpine
    restart: always
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Dev mode: plain HTTP on :80. For production TLS, use the prod overlay
      # (see docs/tls.md) which publishes :443 and mounts the real certs:
      #   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
      # and drop fullchain.pem + privkey.pem into ./infra/nginx/tls/certs.
      - ./infra/nginx/http:/etc/nginx/tls:ro
    ports:
      - "80:80"
    depends_on:
      identity-api:
        condition: service_healthy
      merchant-api:
        condition: service_healthy
      payment-api:
        condition: service_healthy
      ledger-api:
        condition: service_healthy
      notification-api:
        condition: service_healthy
      settlement-api:
        condition: service_healthy
      merchant-web:
        condition: service_healthy
      admin-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/identity/health/live || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    networks:
      - paymentswitch-network

  # Nightly Postgres backup job (Step 10.1): runs infra/backup/pg-backup.sh
  # on a 24h loop against the healthy postgres service; artifacts land in the
  # pgbackups volume (see docs/runbook.md "Backups").
  backup:
    image: postgres:16-alpine
    restart: always
    command: ["sh", "-c", "while true; do /scripts/pg-backup.sh; sleep 86400; done"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: paymentswitch
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BACKUP_DIR: /backups
      KEEP_DAILY: 14
    volumes:
      - ./infra/backup/pg-backup.sh:/scripts/pg-backup.sh:ro
      - pgbackups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    networks:
      - paymentswitch-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  pgbackups:

networks:
  paymentswitch-network:
    driver: bridge