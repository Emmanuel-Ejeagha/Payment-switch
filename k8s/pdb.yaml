# Step 9.4: every workload currently runs a single replica, so requiring
# one pod to stay available would forbid ALL voluntary disruptions (drains
# hang forever). Allowing a single unavailable pod lets the singleton be
# evicted and rescheduled; it still protects scaled-out Deployments one pod
# at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: identity-api
  namespace: payment-switch
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: identity-api
---
