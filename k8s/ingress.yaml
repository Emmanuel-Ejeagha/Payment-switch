apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payment-switch-ingress
  namespace: payment-switch
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    # Force HTTPS: HTTP requests are redirected to https (TASK-004).
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Issue/renew the cert into the payment-switch-tls secret automatically
    # (see k8s/cert-manager-cluster-issuer.yaml). Remove this annotation when
    # terminating TLS at an AWS ALB/ACM instead.
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    # REPLACE the placeholder host with the real domain before applying.
    - hosts:
        - paymentswitch.example.com
      secretName: payment-switch-tls
  rules:
    - host: paymentswitch.example.com
      http:
        paths:
          - path: /identity(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: identity-api
                port:
                  number: 8080
          - path: /merchant(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: merchant-api
                port:
                  number: 8080
          - path: /payment(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: payment-api
                port:
                  number: 8080
          - path: /ledger(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ledger-api
                port:
                  number: 8080
          - path: /notification(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: notification-api
                port:
                  number: 8080
          - path: /settlement(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: settlement-api
                port:
                  number: 8080