apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlement-api
  namespace: payment-switch
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: settlement-api
  template:
    metadata:
      labels:
        app: settlement-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: settlement-api
          image: paymentswitch-settlement:latest
          env:
            - name: ConnectionStrings__SettlementDb
              valueFrom:
                secretKeyRef:
                  name: payment-switch-secret
                  key: SettlementDb__ConnectionString
            - name: Jwt__Secret
              valueFrom:
                secretKeyRef:
                  name: payment-switch-secret
                  key: Jwt__Secret
            - name: Jwt__PreviousSecret
              valueFrom:
                secretKeyRef:
                  name: payment-switch-secret
                  key: Jwt__PreviousSecret
                  optional: true
            - name: Jwt__Issuer
              valueFrom:
                configMapKeyRef:
                  name: payment-switch-config
                  key: Jwt__Issuer
            - name: Jwt__Audience
              valueFrom:
                configMapKeyRef:
                  name: payment-switch-config
                  key: Jwt__Audience
            - name: RabbitMQ__HostName
              valueFrom:
                configMapKeyRef:
                  name: payment-switch-config
                  key: RabbitMQ__HostName
            - name: RabbitMQ__UserName
              valueFrom:
                secretKeyRef:
                  name: payment-switch-secret
                  key: RabbitMQ__UserName
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: payment-switch-secret
                  key: RabbitMQ__Password
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: settlement-api
  namespace: payment-switch
spec:
  selector:
    app: settlement-api
  ports:
    - port: 8080
      targetPort: 8080