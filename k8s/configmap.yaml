apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-switch-config
  namespace: payment-switch
data:
  Jwt__Issuer: "IdentityService"
  Jwt__Audience: "PaymentSwitch"
  RabbitMQ__HostName: "rabbitmq"
  EmailVerification__FrontendBaseUrl: "http://localhost:3000"
  PasswordReset__FrontendBaseUrl: "http://localhost:3000"
  PasswordReset__TokenLifetimeHours: "1"
  Smtp__Host: ""
  Smtp__Port: "587"
  Smtp__Username: ""
  Smtp__FromAddress: "noreply@paymentswitch.com"
  Smtp__FromName: "PaymentSwitch"
  Resend__FromEmail: "noreply@paymentswitch.com"
  Resend__FromName: "PaymentSwitch"
  Resend__TimeoutSeconds: "30"
  EmailVerification__ResendCooldownSeconds: "60"
  Sms__Enabled: "false"
  Retention__CleanupIntervalMinutes: "60"
  Retention__BatchSize: "100"
  Retention__MessageRetentionDays: "7"
  # Frontend API base URL (inlined at build time, also injected at runtime so
  # the Next.js server-side API proxy reaches the right origin). HTTPS in prod.
  NEXT_PUBLIC_API_URL: "http://localhost"
