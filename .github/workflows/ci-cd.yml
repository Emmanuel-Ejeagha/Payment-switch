name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  NAMESPACE: payment-switch
  # github.repository is "owner/repo" but preserves the account's display
  # case (Emmanuel-Ejeagha/...), while GHCR paths must be lowercase. There is
  # no lower() in GitHub Actions expressions, so the docker/docker-frontend/
  # deploy jobs lowercase it via shell (${GITHUB_REPOSITORY,,}) into
  # IMAGE_NAMESPACE before tagging, scanning, or deploying.
  IMAGE_NAMESPACE: ${{ github.repository }}

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore PaymentSwitch.slnx

      - name: Audit NuGet packages for vulnerabilities
        # Step 9.8: explicit report step. The gate itself lives in
        # Directory.Build.props (NU1901-NU1904 escalated to errors), so any
        # build/test also fails on vulnerable packages.
        run: dotnet list PaymentSwitch.slnx package --vulnerable --include-transitive

      - name: Verify formatting
        run: dotnet format PaymentSwitch.slnx --verify-no-changes --no-restore

      - name: Build solution
        run: dotnet build PaymentSwitch.slnx --configuration Release --no-restore

      - name: Run unit tests with coverage
        run: |
          # Excludes the Testcontainers integration suites (which need Docker and
          # are slow); they run serially in the dedicated 'integration' job below.
          dotnet test PaymentSwitch.slnx --configuration Release --no-build \
            --filter "FullyQualifiedName!~API.IntegrationTests" --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/

  integration:
    name: Integration Tests
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One suite per runner (matrix): six sequential suites on a single 2-core
    # runner starve cold Testcontainers boots (RabbitMQ attach takes 30-60s+)
    # and cause broker-readiness flakes. fail-fast false so one red suite does
    # not hide the others' results. The job name stays un-suffixed so the
    # branch-protection required check keeps matching.
    strategy:
      fail-fast: false
      matrix:
        suite: [Identity, Merchant, Payment, Ledger, Notification, Settlement]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore PaymentSwitch.slnx

      - name: Build solution
        run: dotnet build PaymentSwitch.slnx --configuration Release --no-restore

      - name: Pre-pull Postgres image
        run: docker pull postgres:16-alpine

      - name: Pre-pull RabbitMQ images
        # Step 9.8: Testcontainers pulls at runtime; pre-pulling warms the
        # cache and fails fast on registry outages (3.13-alpine is what the
        # Ledger suites actually boot).
        run: |
          docker pull rabbitmq:3-management-alpine
          docker pull rabbitmq:3.13-alpine

      - name: Integration tests - ${{ matrix.suite }}
        run: dotnet test tests/Integration/${{ matrix.suite }}.API.IntegrationTests --configuration Release --no-build

  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck admin
        run: npm run typecheck --workspace=admin

      - name: Typecheck merchant
        run: npm run typecheck --workspace=merchant

      - name: Lint admin
        run: npm run lint --workspace=admin

      - name: Lint merchant
        run: npm run lint --workspace=merchant

      - name: Test admin
        run: npm run test --workspace=admin

      - name: Test merchant
        run: npm run test --workspace=merchant

      - name: Build admin
        run: npm run build --workspace=admin

      - name: Build merchant
        run: npm run build --workspace=merchant

  manifest-validate:
    name: Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        # Lint renders the chart, so the required-secret guards need the same
        # dummy values as the render step (never real secrets).
        run: >
          helm lint helm/payment-switch
          --set config.postgres.password=dummy
          --set config.jwt.secret=0123456789abcdef0123456789abcdef
          --set config.serviceToken.secret=dummy-service-token-secret-0123456789abcdef
          --set config.rabbitmq.password=dummy
          --set config.seed.adminPassword=dummy
          --set config.webhookSecretEncryption.key=dummy
          --set config.smtp.password=dummy
          --set config.grafana.adminPassword=dummy

      - name: Render chart (ingress enabled)
        # Dummy secrets: rendering only needs the keys present, never real values.
        run: >
          helm template payment-switch helm/payment-switch --namespace payment-switch
          --set config.postgres.password=dummy
          --set config.jwt.secret=0123456789abcdef0123456789abcdef
          --set config.serviceToken.secret=dummy-service-token-secret-0123456789abcdef
          --set config.rabbitmq.password=dummy
          --set config.seed.adminPassword=dummy
          --set config.webhookSecretEncryption.key=dummy
          --set config.smtp.password=dummy
          --set config.grafana.adminPassword=dummy
          --set ingress.enabled=true
          --set ingress.host=paymentswitch.example.com
          --set ingress.tls.enabled=true
          --set ingress.tls.secretName=payment-switch-tls
          > /tmp/helm-rendered.yaml

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Validate k8s manifests
        # ClusterIssuer is a cert-manager CRD with no stock schema; everything
        # else must validate strictly (this caught a merged-documents bug in
        # hpa.yaml and a dangling selector in pdb.yaml).
        run: kubeconform -strict -summary -skip ClusterIssuer k8s/

      - name: Validate rendered chart
        run: kubeconform -strict -summary /tmp/helm-rendered.yaml

  docker:
    name: Docker Build & Push
    needs: [build-test, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      matrix:
        # `service` stays lowercase for image tags; `dir` matches the real
        # on-disk casing (Linux runners are case-sensitive, so the Dockerfile
        # path cannot use the lowercase tag name).
        service:
          - name: identity
            dir: Identity
          - name: merchant
            dir: Merchant
          - name: payment
            dir: Payment
          - name: ledger
            dir: Ledger
          - name: notification
            dir: Notification
          - name: settlement
            dir: Settlement
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image namespace for GHCR
        # GHCR repository paths must be lowercase, but github.repository
        # preserves the account's display case (Emmanuel-Ejeagha/...).
        # Overriding IMAGE_NAMESPACE here fixes every tag/image-ref below.
        run: echo "IMAGE_NAMESPACE=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/Services/${{ matrix.service.dir }}/${{ matrix.service.dir }}.API/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service.name }}-api:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service.name }}-api:latest

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service.name }}-api:${{ github.sha }}
          # The action's default Trivy version does not exist upstream;
          # pin a real one (verified via the aquasecurity/trivy releases API).
          version: v0.74.0
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-${{ matrix.service.name }}.sarif
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        with:
          sarif_file: trivy-${{ matrix.service.name }}.sarif

  docker-frontend:
    name: Docker Build & Push (frontends)
    needs: [frontend, build-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      matrix:
        app:
          - name: merchant
            port: 3000
          - name: admin
            port: 3001
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image namespace for GHCR
        # GHCR repository paths must be lowercase, but github.repository
        # preserves the account's display case (Emmanuel-Ejeagha/...).
        # Overriding IMAGE_NAMESPACE here fixes every tag/image-ref below.
        run: echo "IMAGE_NAMESPACE=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.app.name }}/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.FRONTEND_API_URL }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.app.name }}-web:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.app.name }}-web:latest

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.app.name }}-web:${{ github.sha }}
          # The action's default Trivy version does not exist upstream;
          # pin a real one (verified via the aquasecurity/trivy releases API).
          version: v0.74.0
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-${{ matrix.app.name }}-web.sarif
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        with:
          sarif_file: trivy-${{ matrix.app.name }}-web.sarif

  deploy:
    name: Deploy to Kubernetes (production)
    needs: [docker, docker-frontend, manifest-validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image namespace for GHCR
        # Must match the tags pushed by the docker jobs (GHCR paths are
        # lowercase; github.repository preserves display case).
        run: echo "IMAGE_NAMESPACE=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > $HOME/.kube/config

      - name: Record previous images (for rollback)
        run: |
          targets=("identity-api" "merchant-api" "payment-api" "ledger-api" "notification-api" "settlement-api" "merchant-web" "admin-web")
          for t in "${targets[@]}"; do
            kubectl get deployment/$t --namespace ${{ env.NAMESPACE }} \
              -o jsonpath="{.spec.template.spec.containers[0].image}" | tee /tmp/$t-previous-image.txt
          done

      - name: Update deployments with new images
        run: |
          kubectl set image deployment/identity-api identity-api=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/identity-api:${{ github.sha }} --namespace ${{ env.NAMESPACE }}
          kubectl set image deployment/merchant-api merchant-api=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/merchant-api:${{ github.sha }} --namespace ${{ env.NAMESPACE }}
          kubectl set image deployment/payment-api payment-api=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/payment-api:${{ github.sha }} --namespace ${{ env.NAMESPACE }}
          kubectl set image deployment/ledger-api ledger-api=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/ledger-api:${{ github.sha }} --namespace ${{ env.NAMESPACE }}
          kubectl set image deployment/notification-api notification-api=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/notification-api:${{ github.sha }} --namespace ${{ env.NAMESPACE }}
          kubectl set image deployment/settlement-api settlement-api=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/settlement-api:${{ github.sha }} --namespace ${{ env.NAMESPACE }}
          kubectl set image deployment/merchant-web merchant-web=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/merchant-web:${{ github.sha }} --namespace ${{ env.NAMESPACE }}
          kubectl set image deployment/admin-web admin-web=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/admin-web:${{ github.sha }} --namespace ${{ env.NAMESPACE }}

      - name: Verify rollout status
        run: |
          kubectl rollout status deployment/identity-api --namespace ${{ env.NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/merchant-api --namespace ${{ env.NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/payment-api --namespace ${{ env.NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/ledger-api --namespace ${{ env.NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/notification-api --namespace ${{ env.NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/settlement-api --namespace ${{ env.NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/merchant-web --namespace ${{ env.NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/admin-web --namespace ${{ env.NAMESPACE }} --timeout=120s

      - name: Rollback on rollout failure
        if: failure()
        run: |
          targets=("identity-api" "merchant-api" "payment-api" "ledger-api" "notification-api" "settlement-api" "merchant-web" "admin-web")
          for t in "${targets[@]}"; do
            PREV=$(cat /tmp/$t-previous-image.txt)
            kubectl set image deployment/$t $t=$PREV --namespace ${{ env.NAMESPACE }}
          done
          echo "Deployment failed; images reverted to previously-recorded versions."