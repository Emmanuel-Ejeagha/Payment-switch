# Production TLS termination. Mount ./infra/nginx/tls into /etc/nginx/tls and
# place fullchain.pem + privkey.pem in ./infra/nginx/tls/certs (gitignored).
# All plaintext HTTP is redirected to HTTPS; HSTS + secure headers are set.
# The backend services see X-Forwarded-Proto: https so ASP.NET Core can honor
# forwarded headers and build https links.

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/tls/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Step 9.9: Docker embedded DNS with a short TTL cap (see http/server.conf).
    resolver 127.0.0.11 valid=10s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # TASK-046: discovery/observability surfaces are kept off the public ingress
    # (defense-in-depth; the apps also disable Swagger in Production). /metrics
    # stays reachable on the Docker network where Prometheus scrapes each API
    # directly on :8080. See docs/prod-exposure.md.
    location ~ ^/(identity|merchant|payment|ledger|notification|settlement)/(swagger(/.*)?|v[0-9.]+/swagger\.json|metrics|hangfire(/.*)?)$ {
        return 404;
    }

    # Merchant portal at the root, admin portal at /admin.
    location /admin {
        set $admin_upstream admin-web;
        proxy_pass http://$admin_upstream:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    location / {
        set $merchant_upstream merchant-web;
        proxy_pass http://$merchant_upstream:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    location /identity/ {
        # Step 9.9: the rewrite preserves the prefix-strip a static
        # `proxy_pass .../;` URI performed (variables disable that magic).
        set $identity_upstream identity-api;
        rewrite ^/identity/(.*)$ /$1 break;
        proxy_pass http://$identity_upstream:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /merchant/ {
        # Step 9.9: see /identity/ above.
        set $merchant_api_upstream merchant-api;
        rewrite ^/merchant/(.*)$ /$1 break;
        proxy_pass http://$merchant_api_upstream:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /payment/ {
        # Step 9.9: see /identity/ above.
        set $payment_upstream payment-api;
        rewrite ^/payment/(.*)$ /$1 break;
        proxy_pass http://$payment_upstream:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ledger/ {
        # Step 9.9: see /identity/ above.
        set $ledger_upstream ledger-api;
        rewrite ^/ledger/(.*)$ /$1 break;
        proxy_pass http://$ledger_upstream:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /notification/ {
        # Step 9.9: see /identity/ above.
        set $notification_upstream notification-api;
        rewrite ^/notification/(.*)$ /$1 break;
        proxy_pass http://$notification_upstream:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    location /settlement/ {
        # Step 9.9: see /identity/ above.
        set $settlement_upstream settlement-api;
        rewrite ^/settlement/(.*)$ /$1 break;
        proxy_pass http://$settlement_upstream:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
