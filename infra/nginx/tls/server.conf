# Production TLS termination. Mount ./infra/nginx/tls into /etc/nginx/tls and
# place fullchain.pem + privkey.pem in ./infra/nginx/tls/certs (gitignored).
# All plaintext HTTP is redirected to HTTPS; HSTS + secure headers are set.
# The backend services see X-Forwarded-Proto: https so ASP.NET Core can honor
# forwarded headers and build https links.

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/tls/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Docker's embedded DNS (127.0.0.11) with a short TTL: container IPs change
    # on every recreate, and nginx otherwise caches the stale address forever.
    # All proxy_pass targets below use variables so this resolver is honored;
    # never use a bare hostname here or recreated APIs silently break.
    resolver 127.0.0.11 valid=10s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # TASK-046: discovery/observability surfaces are kept off the public ingress
    # (defense-in-depth; the apps also disable Swagger in Production). /metrics
    # stays reachable on the Docker network where Prometheus scrapes each API
    # directly on :8080. See docs/prod-exposure.md.
    location ~ ^/(identity|merchant|payment|ledger|notification|settlement)/(swagger(/.*)?|v[0-9.]+/swagger\.json|metrics|hangfire(/.*)?)$ {
        return 404;
    }

    # Merchant portal at the root, admin portal at /admin.
    location /admin {
        set $upstream admin-web:3001;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    location / {
        set $upstream merchant-web:3000;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    location /identity/ {
        set $upstream identity-api:8080;
        rewrite ^/identity/(.*)$ /$1 break;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /merchant/ {
        set $upstream merchant-api:8080;
        rewrite ^/merchant/(.*)$ /$1 break;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /payment/ {
        set $upstream payment-api:8080;
        rewrite ^/payment/(.*)$ /$1 break;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ledger/ {
        set $upstream ledger-api:8080;
        rewrite ^/ledger/(.*)$ /$1 break;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /notification/ {
        set $upstream notification-api:8080;
        rewrite ^/notification/(.*)$ /$1 break;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    location /settlement/ {
        set $upstream settlement-api:8080;
        rewrite ^/settlement/(.*)$ /$1 break;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
