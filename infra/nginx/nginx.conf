events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Active server blocks are mounted into /etc/nginx/tls/ (see
    # docker-compose.yml -> nginx.volumes):
    #   - dev:  ./infra/nginx/http  -> plain HTTP on :80 (no certs needed)
    #   - prod: ./infra/nginx/tls   -> HTTP->HTTPS redirect + HTTPS on :443
    #                                  (certs live in ./infra/nginx/tls/certs)
    # See docs/tls.md for provisioning and renewal.
    include /etc/nginx/tls/*.conf;
}
