global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Step 8.1: the path contract is explicit (every API maps
  # MapPrometheusScrapingEndpoint at /metrics; nginx denies it publicly by
  # design, so Prometheus scrapes the Docker network directly).
  - job_name: identity
    metrics_path: /metrics
    static_configs:
      - targets: ["identity-api:8080"]
  - job_name: merchant
    metrics_path: /metrics
    static_configs:
      - targets: ["merchant-api:8080"]
  - job_name: payment
    metrics_path: /metrics
    static_configs:
      - targets: ["payment-api:8080"]
  - job_name: ledger
    metrics_path: /metrics
    static_configs:
      - targets: ["ledger-api:8080"]
  - job_name: notification
    metrics_path: /metrics
    static_configs:
      - targets: ["notification-api:8080"]
  - job_name: settlement
    metrics_path: /metrics
    static_configs:
      - targets: ["settlement-api:8080"]
  - job_name: rabbitmq
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]