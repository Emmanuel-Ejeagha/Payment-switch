namespace: payment-switch

global:
  imagePullPolicy: IfNotPresent
  imageRegistry: ""

services:
  identity:
    enabled: true
    name: identity
    replicaCount: 1
    image:
      repository: paymentswitch/identity-api
      tag: latest
    containerPort: 8080
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    probes:
      livenessPath: /health/live
      readinessPath: /health/ready
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 80

  payment:
    enabled: true
    name: payment
    replicaCount: 1
    # Journal/payment rows are financial records: 7 years (Step 9.5).
    retentionBusinessDays: 2557
    image:
      repository: paymentswitch/payment-api
      tag: latest
    containerPort: 8080
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    probes:
      livenessPath: /health/live
      readinessPath: /health/ready
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 80

  merchant:
    enabled: true
    name: merchant
    replicaCount: 1
    image:
      repository: paymentswitch/merchant-api
      tag: latest
    containerPort: 8080
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    probes:
      livenessPath: /health/live
      readinessPath: /health/ready
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 80

  ledger:
    enabled: true
    name: ledger
    replicaCount: 1
    # Journal entries are financial records: 7 years (Step 9.5).
    retentionBusinessDays: 2557
    image:
      repository: paymentswitch/ledger-api
      tag: latest
    containerPort: 8080
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    probes:
      livenessPath: /health/live
      readinessPath: /health/ready
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 80

  notification:
    enabled: true
    name: notification
    replicaCount: 1
    # Delivered notifications: 90 days (Step 9.5).
    retentionBusinessDays: 90
    image:
      repository: paymentswitch/notification-api
      tag: latest
    containerPort: 8080
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    probes:
      livenessPath: /health/live
      readinessPath: /health/ready
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 80

  settlement:
    enabled: true
    name: settlement
    replicaCount: 1
    image:
      repository: paymentswitch/settlement-api
      tag: latest
    containerPort: 8080
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    probes:
      livenessPath: /health/live
      readinessPath: /health/ready
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 80

config:
  jwt:
    issuer: "IdentityService"
    audience: "PaymentSwitch"
    # REQUIRED: provide a strong secret via --set config.jwt.secret="..." or a secrets values file.
    # No default is shipped on purpose: the chart fails fast (see templates/secret.yaml)
    # instead of ever deploying an empty secret.
    # secret: <set-me>
    # Optional: the previous signing key during a rotation dual-write window.
    # Set alongside config.jwt.secret on the first rotation step; remove once
    # the window closes (see infra/secrets/rotate-jwt.sh).
    previousSecret: ""
  serviceToken:
    # REQUIRED: dedicated inter-service secret, must differ from config.jwt.secret.
    # Provide via --set config.serviceToken.secret="..." or a secrets values file.
    # No default is shipped on purpose (fail-fast in templates/secret.yaml).
    # secret: <set-me>
  rabbitmq:
    hostName: "rabbitmq"
    # REQUIRED: provide a strong username/password via --set or a secrets values file
    userName: "paymentswitch"
    # REQUIRED: provide a strong password via --set config.rabbitmq.password="..."
    # No default is shipped on purpose (fail-fast in templates/secret.yaml).
    # password: <set-me>
  postgres:
    hostName: "postgres"
    userName: "paymentswitch"
    # REQUIRED: provide a strong password via --set config.postgres.password="..."
    # No default is shipped on purpose (fail-fast in templates/secret.yaml).
    # password: <set-me>
  seed:
    adminEmail: "admin@paymentswitch.com"
    # REQUIRED: provide a strong admin password via --set config.seed.adminPassword="..."
    # No default is shipped on purpose (fail-fast in templates/secret.yaml).
    # adminPassword: <set-me>
  webhookSecretEncryption:
    # REQUIRED: AES-256 key (base64) used by the Merchant service to encrypt
    # webhook secrets at rest (TASK-006). See Merchant.API webhook secret config.
    # No default is shipped on purpose (fail-fast in templates/secret.yaml).
    # key: <set-me>
  emailVerification:
    frontendBaseUrl: "http://localhost:3000"
    resendCooldownSeconds: 60
  passwordReset:
    frontendBaseUrl: "http://localhost:3000"
    tokenLifetimeHours: 1
  smtp:
    host: ""
    port: 587
    username: ""
    # Optional: SMTP relays that need no auth leave host empty (email sender
    # stays unconfigured). A non-empty sentinel fails loudly instead of
    # silently authenticating with a blank password when a host IS set.
    password: "CHANGEME-via---set-config.smtp.password-or-secrets-file"
    fromAddress: "noreply@paymentswitch.com"
    fromName: "PaymentSwitch"
  resend:
    # REQUIRED in Production: Resend API token for verification mail.
    # Provide via --set config.resend.apiKey="..." or a secrets values file.
    # No default is shipped on purpose (fail-fast in templates/secret.yaml).
    apiKey: "CHANGEME-via---set-config.resend.apiKey-or-secrets-file"
    fromEmail: "noreply@paymentswitch.com"
    fromName: "PaymentSwitch"
    timeoutSeconds: 30
  sms:
    enabled: false
  retention:
    # Shared archival-sweep tuning (Step 9.5); per-service business-record
    # retention differs, so services.payment/ledger/notification carry
    # retentionBusinessDays below. Only those three run retention workers.
    cleanupIntervalMinutes: 60
    batchSize: 100
    messageRetentionDays: 7
  grafana:
    adminUser: "admin"
    # REQUIRED when infrastructure.grafana.enabled=true (fail-fast in
    # templates/secret.yaml). No default is shipped on purpose.
    # adminPassword: <set-me>
  frontend:
    # NEXT_PUBLIC_API_URL is inlined at build time; set the HTTPS origin (e.g.
    # https://paymentswitch.example.com). See docs/tls.md.
    apiUrl: "http://localhost"

frontends:
  merchant:
    enabled: true
    name: merchant-web
    replicaCount: 1
    image:
      repository: paymentswitch/merchant-web
      tag: latest
    containerPort: 3000
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 80
  admin:
    enabled: true
    name: admin-web
    replicaCount: 1
    image:
      repository: paymentswitch/admin-web
      tag: latest
    containerPort: 3001
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 80

infrastructure:
  postgres:
    enabled: true
    image: postgres:16-alpine
    port: 5432
    storageSize: 1Gi
    storageClassName: ""
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1
        memory: 512Mi
  rabbitmq:
    enabled: true
    image: rabbitmq:3-management-alpine
    port: 5672
    managementPort: 15672
    prometheusPort: 15692
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  redis:
    enabled: false
    image: redis:7-alpine
    port: 6379
  prometheus:
    enabled: false
  grafana:
    enabled: false
  jaeger:
    enabled: false

ingress:
  enabled: false
  host: payment-switch.local
  tls:
    enabled: false
    secretName: payment-switch-tls

networkPolicy:
  enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1
