apiVersion: v1
kind: Secret
metadata:
  name: payment-switch-secret
  namespace: {{ .Values.namespace }}
type: Opaque
{{- if not .Values.config.postgres.password }}
{{ fail "config.postgres.password is required (set via --set or a secrets values file)" }}
{{- end }}
{{- if not .Values.config.jwt.secret }}
{{ fail "config.jwt.secret is required (set via --set or a secrets values file)" }}
{{- end }}
{{- if not .Values.config.rabbitmq.password }}
{{ fail "config.rabbitmq.password is required (set via --set or a secrets values file)" }}
{{- end }}
{{- if not .Values.config.seed.adminPassword }}
{{ fail "config.seed.adminPassword is required (set via --set or a secrets values file)" }}
{{- end }}
{{- if not .Values.config.webhookSecretEncryption.key }}
{{ fail "config.webhookSecretEncryption.key is required (set via --set or a secrets values file)" }}
{{- end }}
{{- if and .Values.infrastructure.grafana.enabled (not .Values.config.grafana.adminPassword) }}
{{ fail "config.grafana.adminPassword is required when infrastructure.grafana is enabled (set via --set or a secrets values file)" }}
{{- end }}
stringData:
  {{- range $db := list "IdentityDb" "MerchantDb" "PaymentDb" "LedgerDb" "NotificationDb" "SettlementDb" }}
  {{ $db }}__ConnectionString: {{ printf "Host=%s;Port=5432;Database=%s;Username=%s;Password=%s" $.Values.config.postgres.hostName $db $.Values.config.postgres.userName $.Values.config.postgres.password | quote }}
  {{- end }}
  Postgres__Password: {{ .Values.config.postgres.password | quote }}
  Jwt__Secret: {{ .Values.config.jwt.secret | quote }}
  RabbitMQ__UserName: {{ .Values.config.rabbitmq.userName | quote }}
  RabbitMQ__Password: {{ .Values.config.rabbitmq.password | quote }}
  Seed__AdminPassword: {{ .Values.config.seed.adminPassword | quote }}
  WebhookSecretEncryption__Key: {{ .Values.config.webhookSecretEncryption.key | quote }}
  Smtp__Password: {{ .Values.config.smtp.password | quote }}
  GrafanaAdminUser: {{ .Values.config.grafana.adminUser | quote }}
  GrafanaAdminPassword: {{ .Values.config.grafana.adminPassword | quote }}
