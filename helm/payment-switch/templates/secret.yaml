apiVersion: v1
kind: Secret
metadata:
  name: payment-switch-secret
  namespace: {{ .Values.namespace }}
type: Opaque
{{- if not .Values.config.postgres.password }}
{{ fail "config.postgres.password is required (set via --set or a secrets values file)" }}
{{- end }}
{{- if not .Values.config.jwt.secret }}
{{ fail "config.jwt.secret is required (set via --set or a secrets values file)" }}
{{- end }}
{{- if not .Values.config.rabbitmq.password }}
{{ fail "config.rabbitmq.password is required (set via --set or a secrets values file)" }}
{{- end }}
stringData:
  {{- range $db := list "IdentityDb" "MerchantDb" "PaymentDb" "LedgerDb" "NotificationDb" "SettlementDb" }}
  {{ $db }}__ConnectionString: {{ printf "Host=%s;Port=5432;Database=%s;Username=%s;Password=%s" $.Values.config.postgres.hostName $db $.Values.config.postgres.userName $.Values.config.postgres.password | quote }}
  {{- end }}
  Postgres__Password: {{ .Values.config.postgres.password | quote }}
  Jwt__Secret: {{ .Values.config.jwt.secret | quote }}
  RabbitMQ__Password: {{ .Values.config.rabbitmq.password | quote }}
