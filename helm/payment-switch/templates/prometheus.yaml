{{- if .Values.infrastructure.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Values.namespace }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    rule_files:
      - /etc/prometheus/alerts.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']

    scrape_configs:
      - job_name: 'payment-switch'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: 'identity|payment|merchant|ledger|notification|settlement'
            action: keep
          - source_labels: [__address__]
            action: replace
            regex: ([^:]+)(?::\d+)?
            replacement: $1:8080
            target_label: __address__
      - job_name: 'rabbitmq'
        static_configs:
          - targets: ['rabbitmq:15692']
  alerts.yml: |
    groups:
      - name: payment-switch
        rules:
          - alert: ServiceDown
            expr: up == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "{{ "{{ $labels.job }}" }} is down"
              description: "Prometheus cannot scrape {{ "{{ $labels.job }}" }} ({{ "{{ $labels.instance }}" }})."
          - alert: High5xxErrorRate
            expr: |
              sum by (job) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
              /
              sum by (job) (rate(http_server_request_duration_seconds_count[5m])) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "{{ "{{ $labels.job }}" }} 5xx rate above 5%"
              description: "{{ "{{ $labels.job }}" }} returned 5xx for {{ "{{ printf \"%.1f\" $value }}" }}%% of its requests over the last 5 minutes."
          - alert: OutboxBacklogHigh
            expr: outbox_backlog > 100
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "{{ "{{ $labels.job }}" }} outbox backlog is high"
              description: "{{ "{{ $labels.job }}" }} has {{ "{{ $value }}" }} outbox messages awaiting publication for over 5 minutes."
          - alert: DeadLetterQueueActivity
            expr: rate({__name__=~"ledger_dead_letters_total|notification_dead_letters_total"}[5m]) > 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Messages are being dead-lettered"
              description: "{{ "{{ $labels.job }}" }} recorded dead-lettered messages at a rate of {{ "{{ $value }}" }}/s over the last 5 minutes."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: config
              mountPath: /etc/prometheus/alerts.yml
              subPath: alerts.yml
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
{{- end }}