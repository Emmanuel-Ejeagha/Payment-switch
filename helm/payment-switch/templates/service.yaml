{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc.name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ $svc.name }}
spec:
  type: ClusterIP
  selector:
    app: {{ $svc.name }}
  ports:
    # Step 9.5: 8080 like the k8s Services (and the compose/Prometheus :8080
    # convention) — the Ingress backends address this port.
    - port: 8080
      targetPort: {{ $svc.containerPort }}
      protocol: TCP
      name: http
---
{{- end }}
{{- end }}
