{{- if .Values.infrastructure.rabbitmq.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: {{ .Values.infrastructure.rabbitmq.image }}
          # Step 8.1: serve the prometheus scrape target (prometheusPort).
          # Args override CMD only, so the image entrypoint (and
          # RABBITMQ_DEFAULT_* handling) still runs via the inner re-entry.
          args: ["sh", "-c", "rabbitmq-plugins enable --offline rabbitmq_prometheus && exec docker-entrypoint.sh rabbitmq-server"]
          ports:
            - containerPort: {{ .Values.infrastructure.rabbitmq.port }}
            - containerPort: {{ .Values.infrastructure.rabbitmq.managementPort }}
            - containerPort: {{ .Values.infrastructure.rabbitmq.prometheusPort }}
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: payment-switch-secret
                  key: RabbitMQ__UserName
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: payment-switch-secret
                  key: RabbitMQ__Password
          resources:
            {{- toYaml .Values.infrastructure.rabbitmq.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: {{ .Values.infrastructure.rabbitmq.port }}
      targetPort: {{ .Values.infrastructure.rabbitmq.port }}
    - name: management
      port: {{ .Values.infrastructure.rabbitmq.managementPort }}
      targetPort: {{ .Values.infrastructure.rabbitmq.managementPort }}
    - name: prometheus
      port: {{ .Values.infrastructure.rabbitmq.prometheusPort }}
      targetPort: {{ .Values.infrastructure.rabbitmq.prometheusPort }}
{{- end }}
